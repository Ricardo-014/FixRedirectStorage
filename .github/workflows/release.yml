name: Publish APK release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.17
      run_id:
        description: Successful Build LSPosed module run containing the APK
        required: true
        default: '37230461609'
      target:
        description: Source commit or branch for the release tag
        required: true
        default: '9060b2345d71680a794b49bdbf3b7b4660d5c6c9'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || 'v0.17' }}
      RELEASE_TARGET: ${{ inputs.target || '9060b2345d71680a794b49bdbf3b7b4660d5c6c9' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: storage-isolation-visibility-fix-debug
          run-id: ${{ inputs.run_id || '37230461609' }}
          github-token: ${{ github.token }}
          path: dist
      - name: Publish existing APK
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          asset="FixRedirectStorage-${RELEASE_TAG#v}-API102.apk"
          mv dist/app-debug.apk "dist/$asset"
          cat > release-notes.md <<'NOTES'
          Modern LSPosed API 102 module for Storage Isolation on Android 17.

          Version 0.17 resolves the Storage Isolation application UID dynamically from the current system package snapshot. Reinstalling the application no longer requires editing a hardcoded UID. Existing API 102 hooks and original service rule retrieval remain in place.

          Keep the original Storage Isolation APK. Enable the module for the Android system / system scope and Storage Isolation, then reboot.

          Target application: moe.shizuku.redirectstorage (UID resolved dynamically).
          This asset is the existing APK from a successful build, without rebuilding or resigning.
          Project code: MIT License (retain the copyright and license notice).
          NOTES
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_TARGET" \
              --title "FixRedirectStorage $RELEASE_TAG (API 102)" \
              --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "dist/$asset" --clobber
